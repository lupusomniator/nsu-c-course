name: Documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  practice:
    name: C solutions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check practice sources and examples
        run: python scripts/check_practice.py
      - name: Check textbook structure and examples
        run: python scripts/check_course.py
      - name: Build and run textbook examples (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_course.py --build
      - name: Build stubs and test all solutions (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_practice.py --build
      - name: Build stubs and test all solutions (Windows, NMake)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "MSVC Build Tools not found" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:CMAKE_GENERATOR = "NMake Makefiles"
          python scripts/check_practice.py --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_course.py --build
          exit $LASTEXITCODE

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build documentation
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check internal links
        run: python3 scripts/check_site.py _site /nsu-c-course
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, practice]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v5
