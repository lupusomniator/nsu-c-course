title: Программирование на C
description: Курс программирования на Си — задачи, разборы, тесты и учебные материалы.
lang: ru
url: https://lupusomniator.github.io
baseurl: /nsu-c-course
theme: just-the-docs
color_scheme: dark

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

search_enabled: true
search:
  heading_level: 3
  previews: 3
  rel_url: false

heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Наверх
aux_links:
  Репозиторий курса:
    - https://github.com/lupusomniator/nsu-c-course

gh_edit_link: true
gh_edit_link_text: Открыть исходник на GitHub
gh_edit_repository: https://github.com/lupusomniator/nsu-c-course
gh_edit_branch: main
gh_edit_view_mode: blob

exclude:
  - Gemfile
  - Gemfile.lock
  - SITE_SETUP.md
  - COURSE_EDITING.md
  - drafts
  - scripts
  - vendor
  - "**/build*"
  - "**/cmake-build-*"
  - "**/CMakeLists.txt"
  - "**/tests"
  - "**/main.c"
  - "**/solution.c"
  - "**/explanation.md"
  - practice/cmake

defaults:
  - scope:
      path: ""
    values:
      layout: default
